name: Check and build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop and audio test libraries
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libvlc5 vlc-plugin-base
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/fetch_fpcalc.py
      - run: ruff check src tests scripts launch.py
      - run: ruff format --check src tests scripts launch.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          JBS_REQUIRE_VLC: '1'
      - run: python -m jbs_mp3_manager --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install 64-bit VLC
        run: choco install vlc --yes --no-progress --limit-output
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/fetch_fpcalc.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          JBS_REQUIRE_VLC: '1'
      - name: Build portable app with VLC
        run: python scripts/build_windows.py --vlc-dir 'C:\Program Files\VideoLAN\VLC'
      - name: Check packaged app startup and audio engine
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath '.\dist\JBs-MP3-Manager\JBs-MP3-Manager.exe' -ArgumentList '--smoke-test','--require-audio','--require-fingerprint' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged app exited with code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: JBs-MP3-Manager-0.5.3-Windows
          path: dist/JBs-MP3-Manager/
          if-no-files-found: error
          retention-days: 30
      - name: Download original 0.3 for an optional small update
        id: baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: JBs-MP3-Manager-0.3.0-Windows
          path: build/baseline-0.3
          run-id: 42312055942
          github-token: ${{ github.token }}
      - name: Build and test update over 0.3
        id: delta
        if: steps.baseline.outcome == 'success'
        continue-on-error: true
        run: python scripts/build_update.py build/baseline-0.3 dist/JBs-MP3-Manager dist/Update-from-0.3
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        if: steps.delta.outcome == 'success'
        with:
          name: JBs-MP3-Manager-0.5.3-UPDATE-from-0.3
          path: dist/Update-from-0.3/
          if-no-files-found: error
          retention-days: 30
