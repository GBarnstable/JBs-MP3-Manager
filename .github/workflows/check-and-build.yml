name: Check and build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop and audio test libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libvlc5 vlc-plugin-base
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts launch.py
      - run: ruff format --check src tests scripts launch.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          JBS_REQUIRE_VLC: '1'
      - run: python -m jbs_mp3_manager --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install 64-bit VLC
        run: choco install vlc --yes --no-progress --limit-output
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          JBS_REQUIRE_VLC: '1'
      - name: Build portable app with VLC
        run: python scripts/build_windows.py --vlc-dir 'C:\Program Files\VideoLAN\VLC'
      - name: Check packaged app startup and audio engine
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath '.\dist\JBs-MP3-Manager\JBs-MP3-Manager.exe' -ArgumentList '--smoke-test','--require-audio' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged app exited with code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: JBs-MP3-Manager-0.2.0-Windows
          path: dist/JBs-MP3-Manager/
          if-no-files-found: error
          retention-days: 30
