[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jbs-mp3-manager"
version = "0.4.6"
description = "A portable, local MP3 library with virtual categories"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "mutagen>=1.47,<2", "python-vlc>=3.0.21203,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "pyinstaller>=6.11", "imageio-ffmpeg>=0.6"]

[project.gui-scripts]
jbs-mp3-manager = "jbs_mp3_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
